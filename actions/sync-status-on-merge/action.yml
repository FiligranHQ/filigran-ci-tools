name: 'Sync Project Status on PR Merge'
description: "On PR merge or manual issue close, moves the Status field (Project v2) of the linked issue(s) based on the feature-flag label present on the issue, closes the issue, adds the solved label, and sets the milestone if needed."

inputs:
  token:
    required: true
  project-owner:
    required: true
  project-number:
    required: true
  feature-flag-label:
    default: 'feature-flag'
  target-milestone:
    default: '0. Candidate'
  fallback-status:
    default: 'Final product validation'
  pr-number:
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Sync linked issues
      uses: actions/github-script@v9
      env:
        PROJECT_OWNER: ${{ inputs.project-owner }}
        PROJECT_NUMBER: ${{ inputs.project-number }}
        FF_LABEL: ${{ inputs.feature-flag-label }}
        TARGET_MILESTONE: ${{ inputs.target-milestone }}
        FALLBACK_STATUS: ${{ inputs.fallback-status }}
        PR_NUMBER_INPUT: ${{ inputs.pr-number }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { findIssueNumbers, skipManualClose, decide } = require(process.env.ACTION_PATH + '/logic.js');
          const api = require(process.env.ACTION_PATH + '/api.js');

          const env = process.env;
          const repo = context.repo;
          const project = { owner: env.PROJECT_OWNER, number: Number(env.PROJECT_NUMBER) };
          const noTestComment = '⚠️ This issue is moved directly to `Done` without a `feature-flag` label and without a dedicated test branch. We therefore assume that it **will not be tested** before going live.';

          let numbers;
          if (context.eventName === 'issues') {
            const issue = context.payload.issue;
            const reason = skipManualClose({
              number: issue.number,
              stateReason: issue.state_reason,
              senderType: context.payload.sender.type,
              closer: await api.getCloser(github, repo, issue.number),
            });
            if (reason) {
              core.info(reason);
              return;
            }
            numbers = [issue.number];
          } else {
            const prNumber = Number(env.PR_NUMBER_INPUT || context.payload.pull_request.number);
            const pr = await api.getPullRequest(github, repo, prNumber);
            numbers = findIssueNumbers({ prNumber, ...pr });
          }
          core.info(`Detected issues: ${numbers.join(' ') || '<none>'}`);
          if (numbers.length === 0) return;

          const field = await api.getStatusField(github, project.owner, project.number);
          const failed = [];

          for (const number of numbers) {
            try {
              const issue = await api.getIssue(github, repo, number, project);
              if (!issue) {
                core.warning(`#${number} is not an issue of ${repo.owner}/${repo.repo} — skipping.`);
                continue;
              }
              if (!issue.itemId) {
                core.info(`Issue #${number} is not in project ${project.owner}/#${project.number} — skipping.`);
                continue;
              }

              const hasFeatureFlag = issue.labels.includes(env.FF_LABEL);
              core.info(`Issue #${number}: status "${issue.status}", feature-flag ${hasFeatureFlag}, milestone "${issue.milestone ?? ''}"`);
              const decision = decide({
                hasFeatureFlag,
                status: issue.status,
                event: context.eventName,
                milestone: issue.milestone,
                targetMilestone: env.TARGET_MILESTONE,
                fallbackStatus: env.FALLBACK_STATUS,
              });
              if (decision.action === 'skip') {
                core.info(decision.reason);
                continue;
              }

              if (decision.status) {
                await api.setStatus(github, field, issue.itemId, decision.status);
                core.info(`✅ Status → "${decision.status}"`);
              }
              if (decision.comment) {
                await api.comment(github, repo, number, noTestComment);
                core.info('✅ "not tested" comment added.');
              }
              if (decision.close) {
                await api.addLabel(github, repo, number, 'solved');
                if (issue.state !== 'CLOSED') await api.closeIssue(github, repo, number);
                core.info('✅ Closed with "solved".');
              }
              if (decision.milestone) {
                const milestone = await api.findMilestone(github, repo, env.TARGET_MILESTONE);
                if (milestone) {
                  await api.setMilestone(github, repo, number, milestone.number);
                  core.info(`✅ Milestone → "${env.TARGET_MILESTONE}"`);
                } else {
                  core.warning(`Milestone "${env.TARGET_MILESTONE}" not found — skipping.`);
                }
              }
            } catch (err) {
              core.error(`Issue #${number}: ${err.message}`);
              failed.push(number);
            }
          }

          if (failed.length > 0) core.setFailed(`Could not sync: #${failed.join(', #')}`);
