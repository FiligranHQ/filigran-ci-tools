name: "PR Title Check"
description: "Reusable GitHub Action to validate PR titles and create a check run."
author: "FiligranHQ"
inputs:
  token:
    description: "GitHub token with checks:write permission (must be generated in your workflow)"
    required: true
runs:
  using: "composite"
  steps:
    - name: Validate PR title and create check
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.event.pull_request.head.sha }}
        TITLE: ${{ github.event.pull_request.title }}
        SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -euo pipefail
        EXIT_CODE=0
        echo "PR title: $TITLE"

        # Shared base: type(scope?)!?:
        BASE_PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.-]+\))?!?: '
        # Shared issue reference core (reused in both patterns)
        ISSUE_CORE='#[0-9]+'
        # Full pattern: base + non-empty description + optional issue ref
        FULL_PATTERN="${BASE_PATTERN}.+?( \(${ISSUE_CORE}\))?$"
        ISSUE_PATTERN="\(${ISSUE_CORE}\)$"
        
        if [[ "$TITLE" =~ $FULL_PATTERN ]]; then
          echo "✅ PR title is valid."
          OUTPUT_TITLE="✅ PR title is valid."
          OUTPUT_SUMMARY="✅ PR title is valid."
          CONCLUSION="success"
        else
          # Diagnose common failures
          # 1) Check type + optional scope + optional ! + colon
          if ! [[ "$TITLE" =~ $BASE_PATTERN ]]; then
            REASON="Bad type/scope prefix. Must match: type(scope?)!?: where type is one of: feat, fix, chore, docs, style, refactor, perf, test, build, ci, revert"
          fi
          # 2) Check description is not empty
          if [[ -z "${REASON:-}" ]] && ! [[ "$TITLE" =~ ${BASE_PATTERN}.+ ]]; then
            REASON="Bad description. Must provide a non-empty description after ': '"
          fi
          if [[ -z "${REASON:-}" ]]; then
            REASON="Bad title. Does not match the required pattern"
          fi
        fi
        # Check issue reference (skip for dependency PRs)
        if [[ -z "${REASON:-}" ]] && [[ "$TITLE" != *"(deps)"* ]] && ! [[ "$TITLE" =~ $ISSUE_PATTERN ]]; then
          REASON="Missing issue reference. Must end with (#XXX)"
        fi
        # Single error reporting block
        if [[ -n "${REASON:-}" ]]; then
          EXIT_CODE=1
          echo "❌ Invalid PR title: $REASON"
          echo "Required format:"
          echo "type(scope?): description (#123)"
          OUTPUT_TITLE="$REASON"
          OUTPUT_SUMMARY="❌ Invalid PR title: $REASON. \nRequired: type(scope?)!?: description (#XXX)"
          CONCLUSION="failure"
        fi
        # Create custom check run only if not from fork
        if [[ "$SOURCE_REPO" == "$REPO" ]]; then
          CHECK_RUN=$(\
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$REPO/check-runs \
              -d @- <<EOF
          {
            "name": "Validate PR Title (optional)",
            "head_sha": "$SHA",
            "status": "in_progress"
          }
        EOF
          )
          CHECK_RUN_ID=$(echo "$CHECK_RUN" | jq -r '.id')
          echo "Created check run ID: $CHECK_RUN_ID"
          # Complete the check run with conclusion + detailed summary
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/check-runs/$CHECK_RUN_ID \
            -d @- <<EOF
          {
            "status": "completed",
            "conclusion": "$CONCLUSION",
            "output": {
              "title": "$OUTPUT_TITLE",
              "summary": "$OUTPUT_SUMMARY"
            }
          }
        EOF
        # Do not fail job (continue-on-error is true)
        exit 0
        fi
        exit "$EXIT_CODE"
